<!DOCTYPE html>
<html>
<head>
    <title>Kaboom Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <!-- Kaboom.js library from a CDN -->
    <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

    <script>
        // Initialize Kaboom
        const k = kaboom({
            global: true,
            fullscreen: true,
            scale: 1,
            debug: true, // Enable debug mode to see logs
            background: [0, 0, 0, 1], // Black background
        });

        // --- Error Logging to Parent Window ---
        // Capture console.error and post it to the parent window
        const originalError = console.error;
        console.error = function(...args) {
            window.parent.postMessage({
                type: 'game-error',
                payload: args.map(arg => arg.toString()) // Convert all args to string for serialization
            }, '*'); // Use a specific origin in production for security
            originalError.apply(console, args);
        };

        // Capture uncaught exceptions
        window.addEventListener('error', function(event) {
            window.parent.postMessage({
                type: 'game-error',
                payload: [event.message, `at ${event.filename}:${event.lineno}:${event.colno}`]
            }, '*');
        });

        // --- AI Generated Code Placeholder ---
        loadBean();

const player = add([
  circle(20, { color: blue }),
  pos(width()/2, height() - 40),
  area(),
  body()
]);

const speed = 200;

onKeyDown("left", () => {
  player.move(-speed, 0);
});

onKeyDown("right", () => {
  player.move(speed, 0);
});

function spawnSquare() {
  const square = add([
    rect(20, 20, { color: red }),
    pos(rand(0, width() - 20), -20),
    area(),
    body(),
    "square"
  ]);

  square.action(() => {
    square.move(0, 100); // Adjust falling speed here
    if (square.pos.y > height()) {
      destroy(square);
    }
  });
}

loop(1, () => {
    spawnSquare();
});

player.onCollide("square", () => {
  go("gameover");
});


go("game", () => {
  add([text("Avoid the Squares!", 32), pos(width()/2, 50), origin("center")]);
});

go("gameover", () => {
  add([text("Game Over!", 32), pos(width()/2, height()/2), origin("center")]);
});
    </script>
</body>
</html>
