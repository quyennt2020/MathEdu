<!DOCTYPE html>
<html>
<head>
    <title>Kaboom Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
    <!-- Kaboom.js library from a CDN -->
    <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>

    <script>
        // Initialize Kaboom
        const k = kaboom({
            global: true,
            fullscreen: true,
            scale: 1,
            debug: true, // Enable debug mode to see logs
            background: [0, 0, 0, 1], // Black background
        });

        // --- Error Logging to Parent Window ---
        // Capture console.error and post it to the parent window
        const originalError = console.error;
        console.error = function(...args) {
            window.parent.postMessage({
                type: 'game-error',
                payload: args.map(arg => arg.toString()) // Convert all args to string for serialization
            }, '*'); // Use a specific origin in production for security
            originalError.apply(console, args);
        };

        // Capture uncaught exceptions
        window.addEventListener('error', function(event) {
            window.parent.postMessage({
                type: 'game-error',
                payload: [event.message, `at ${event.filename}:${event.lineno}:${event.colno}`]
            }, '*');
        });

        // --- AI Generated Code Placeholder ---

    // Load the default sprite
    loadBean();

    // Add a player character
    const player = add([
        sprite("bean"),
        pos(120, 80),
        area(),
        body(), // Make it a physical body that responds to gravity
    ]);

    // Add a ground platform
    add([
        rect(width(), 48),
        pos(0, height() - 48),
        outline(4),
        area(),
        solid(), // Make it solid so other objects can't pass through
        color(127, 200, 255),
    ]);

    // Player movement controls
    const SPEED = 320;
    onKeyDown("left", () => {
        player.move(-SPEED, 0);
    });

    onKeyDown("right", () => {
        player.move(SPEED, 0);
    });

    onKeyPress("space", () => {
        // .isGrounded() is a Kaboom function that checks if the object is on a solid surface
        if (player.isGrounded()) {
            player.jump();
        }
    });

    </script>
</body>
</html>
